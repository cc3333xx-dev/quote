<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press-on Nails Quotation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#e8eaed;color:#333}
.app{max-width:860px;margin:30px auto}
.header{background:linear-gradient(135deg,#2d3748,#1a202c);border-radius:16px 16px 0 0;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.header h1{font-size:18px;font-weight:600;letter-spacing:.5px}
.header .company{font-size:13px;color:#a0aec0}
.card{background:#fff;border-radius:0 0 16px 16px;padding:24px 28px 32px;box-shadow:0 4px 24px rgba(0,0,.08)}
.section-title{font-size:14px;font-weight:600;color:#1a202c;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sku-textarea{width:100%;min-height:110px;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;line-height:1.7;resize:vertical;font-family:'SF Mono',Monaco,Consolas,monospace}
.sku-textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.sku-hint{font-size:12px;color:#a0aec0;margin-top:6px;line-height:1.6}
    .sku-list{margin-top:10px;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;background:#f7fafc;display:none}
    .sku-list-title{font-size:13px;font-weight:600;color:#4a5568;margin-bottom:8px}
    .sku-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #edf2f7}
    .sku-item:last-child{border-bottom:none}
    .sku-item .sku-name{font-size:14px;color:#1a202c;font-weight:500;min-width:90px}
    .sku-item .sku-qty-label{font-size:13px;color:#718096;margin-left:auto}
    .sku-item .sku-qty-input{padding:5px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:14px;text-align:right;width:80px;background:#fff}
.sku-hint code{background:#f1f5f9;padding:1px 5px;border-radius:4px}
.btn-load{width:100%;padding:12px;background:#1a202c;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.btn-load:hover{background:#2d3748}
.profit-row{display:flex;align-items:center;gap:8px;margin-top:18px}
.profit-label{font-size:14px;font-weight:600;white-space:nowrap}
.profit-btns{display:flex;gap:8px;flex:1}
.pbtn{flex:1;padding:9px 0;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#4a5568;font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.pbtn:hover{background:#f7fafc}
.pbtn.active{background:#1a202c;color:#fff;border-color:#1a202c}
.param-row{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.param-item{flex:1;min-width:140px}
.param-item label{font-size:13px;color:#718096;display:block;margin-bottom:5px}
.param-item input,.param-item select{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;color:#1a202c}
.param-item input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.action-bar{display:flex;gap:12px;margin-top:22px}
.btn-action{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;transition:all .15s}
.btn-clear{background:#fff;color:#4a5568;border:1px solid #e2e8f0}
.btn-download{background:linear-gradient(135deg,#68d391,#48bb78);color:#fff}
.btn-pdf{background:linear-gradient(135deg,#f56565,#e53e3e);color:#fff}
.btn-download:hover{background:linear-gradient(135deg,#48bb78,#38a169)}
input[type=file]{display:none}
#status{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:6px;display:none}

/* 报价单预览 - 比原始版大一点点 */
.quotation-section{margin-top:32px}
.quotation-card{background:#fff;border:1px solid #333;border-radius:4px;padding:32px 40px;max-width:800px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.12);font-size:15px;color:#000}
.qt-title{text-align:center;font-size:22px;font-weight:700;letter-spacing:3px;margin-bottom:20px}
.qt-meta{width:100%;border-collapse:collapse;margin-bottom:16px;border:1px solid #000}
.qt-meta td{padding:9px 14px;border:1px solid #000}
.qt-meta td:first-child{width:35%;font-weight:600;background:#f5f5f5}
.qt-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
.qt-table th{border:1px solid #000;padding:9px 14px;text-align:center;font-weight:600;background:#f0f0f0;font-size:15px}
.qt-table td{border:1px solid #000;padding:8px 14px;text-align:right;font-size:15px}
.qt-table td:first-child{text-align:left}
.qt-table tfoot td{font-weight:700;font-size:15px}
.qt-info{width:100%;border-collapse:collapse;margin-top:16px;border:1px solid #000}
.qt-info td{padding:8px 14px;border:1px solid #000}
.qt-info td:first-child{width:200px;font-weight:600;background:#f9f9f9}
.qt-empty{text-align:center;padding:60px 20px;color:#aaa}
@media print{
  body *{visibility:hidden}
  #qSection,#qSection *{visibility:visible}
  #qSection{position:absolute;left:0;top:0;width:100%;padding:20px}
  .quotation-card{box-shadow:none;border:1px solid #000}
  .action-bar{display:none !important}
}
@media(max-width:600px){.card{padding:18px 16px 24px}.param-row{flex-direction:column;gap:10px}.action-bar{flex-direction:column}.quotation-card{padding:20px}}
</style>
<!-- 本地库，无需网页服务器 -->
<script src="xlsx.full.min.js"></script>
<script src="exceljs.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>✦ QUOTATION</h1>
    <span class="company">东阳市迪佳工艺品有限公司</span>
  </div>
  <div class="card">
    <div class="section-title">输入SKU编号</div>
    <textarea id="skuInput" class="sku-textarea" placeholder="每行一个SKU，空格后跟数量&#10;&#10;例如：&#10;AW420  50&#10;CW620  30&#10;BW162  100"></textarea>
    <div class="sku-hint">格式：<code>SKU编号  数量</code> &nbsp; 只写SKU则使用默认起订量</div>
    <div id="skuList" class="sku-list"></div>
    <label class="btn-load" for="dbFile">⊕ 上传产品库Excel（可选）</label>
    <input type="file" id="dbFile" accept=".xlsx,.xls,.csv">
    <div id="dbStatus" style="margin-top:8px;font-size:13px;color:#38a169;">✅ 已内嵌 749 个产品，可直接输入SKU查询</div>
    <div id="status"></div>

    <div class="profit-row">
      <span class="profit-label">〰 利润率</span>
      <div class="profit-btns">
        <button class="pbtn" data-r="30" onclick="setP(30)">30%</button>
        <button class="pbtn" data-r="35" onclick="setP(35)">35%</button>
        <button class="pbtn" data-r="40" onclick="setP(40)">40%</button>
        <button class="pbtn" data-r="45" onclick="setP(45)">45%</button>
        <button class="pbtn active" data-r="50" onclick="setP(50)">50%</button>
      </div>
    </div>

    <div class="param-row">
      <div class="param-item"><label>$ 汇率 (RMB→USD)</label><input type="number" id="exRate" value="6.75" step="0.01"></div>
      <div class="param-item"><label>◎ 起订量 (Sets)</label><input type="number" id="moq" value="50" min="1"></div>
      <div class="param-item"><label>📅 有效期 (天)</label><input type="number" id="validity" value="7" min="1"></div>
    </div>
    <div class="param-row">
      <div class="param-item"><label>🕐 交货期</label><input type="text" id="delivery" value="7-15 Working Days"></div>
    </div>
    <div class="param-row">
      <div class="param-item"><label>💳 付款条款</label><input type="text" id="payment" value="50% Deposit, Balance Before Shipment"></div>
    </div>

    <div class="action-bar">
      <button class="btn-action btn-clear" onclick="clearAll()">🗑 清空</button>
      <button class="btn-action btn-download" onclick="downloadQuotation()" style="background:linear-gradient(135deg,#63b3ed,#4299e1)">⬇ 下载 Excel</button>
      <button class="btn-action btn-pdf" onclick="exportPDF()" style="flex:1.2">📄 直接导出PDF（完美格式）</button>
    </div>
  </div>

  <div class="quotation-section" id="qSection" style="display:none;">
    <div class="quotation-card" id="qCard"></div>
  </div>
</div>

  statusEl.style.background = type === 'error' ? '#fed7d7' : (type === 'success' ? '#c6f6d5' : '#f7fafc');
  statusEl.innerHTML = msg;
}
if (exceljsLoaded) showStatus('✅ ExcelJS 已加载', 'success');

var profitRate = 50;
var quotationItems = [];

function setP(p) {
  profitRate = p;
  document.querySelectorAll('.pbtn').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.getAttribute('data-r')) === p);
  });
  buildQuotation();
}

function parseSKUs() {
  var text = document.getElementById('skuInput').value.trim();
  if (!text) return [];
  var moq = parseInt(document.getElementById('moq').value) || 50;
  return text.split('\n').filter(function(l){return l.trim()}).map(function(line) {
    var parts = line.trim().split(/[\s\t]+/);
    var sku = parts[0].toUpperCase();
    var qty = parseInt(parts[1]) || moq;
    return { sku: sku, qty: qty };
  }).filter(function(x){return x.sku});
}

// 渲染SKU列表（含可编辑数量输入框）
function renderSKUList() {
  var container = document.getElementById('skuList');
  if (_skipRender) return;
  if (quotationItems.length === 0) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = 'block';
  var html = '<div class="sku-list-title">📋 已添加 ' + quotationItems.length + ' 个SKU（修改数量后自动重新报价）</div>';
  quotationItems.forEach(function(item, idx) {
    var found = item.unitPrice !== null;
    html += '<div class="sku-item">' +
      '<span class="sku-name">' + esc(item.model) + (found ? '' : ' ❌') + '</span>' +
      '<span class="sku-qty-label">数量：</span>' +
      '<input class="sku-qty-input" type="number" min="1" value="' + item.qty + '" data-idx="' + idx + '">' +
      (found ? '<span class="sku-price">$' + item.unitPrice.toFixed(2) + '</span>' : '') +
      '</div>';
  });
  container.innerHTML = html;
}

function buildQuotation() {
  var entries = parseSKUs();
  if (entries.length === 0) { document.getElementById('qSection').style.display='none'; return; }

  var rate = parseFloat(document.getElementById('exRate').value) || 6.75;
  var pf = profitRate / 100;

  quotationItems = [];
  var totalQty = 0;
  var grandTotal = 0;

  entries.forEach(function(e) {
    var priceRMB = _DB[e.sku];
    totalQty += e.qty;
    if (priceRMB) {
      var costUSD = priceRMB / rate;
      var unitPrice = costUSD * (1 + pf);
      var subtotal = unitPrice * e.qty;
      grandTotal += subtotal;
      quotationItems.push({ model:e.sku, qty:e.qty, priceRMB:priceRMB, costUSD:+costUSD.toFixed(4), unitPrice:+unitPrice.toFixed(2), subtotal:+subtotal.toFixed(2) });
    } else {
      quotationItems.push({ model:e.sku, qty:e.qty, priceRMB:null, costUSD:null, unitPrice:null, subtotal:null });
    }
  });

  var now = new Date();
  var dateStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0');
  var qNo = 'Q' + now.toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random()*900)+100);
  var delivery = document.getElementById('delivery').value;
  var payment = document.getElementById('payment').value;
  var validity = document.getElementById('validity').value;

  var html = '<div class="qt-title">QUOTATION</div>';

  // 顶部信息区 - 4列布局与产品表对齐
  html += '<table class="qt-meta"><colgroup><col style="width:35%"><col style="width:15%"><col style="width:25%"><col style="width:25%"></colgroup><tbody>';
  html += '<tr><td>Currency:</td><td colspan="3">USD</td></tr>';
  html += '<tr><td>Customer:</td><td colspan="3"></td></tr>';
  html += '<tr><td>Quotation Date:</td><td colspan="3">' + dateStr + '</td></tr>';
  html += '<tr><td>Quotation No.:</td><td colspan="3">' + qNo + '</td></tr>';
  html += '</tbody></table>';

  // 产品明细表
  html += '<table class="qt-table"><thead><tr><th style="width:35%">Model</th><th style="width:15%">Qty</th><th style="width:25%">Unit Price</th><th style="width:25%">Subtotal</th></tr></thead><tbody>';
  quotationItems.forEach(function(item) {
    if (item.unitPrice !== null)
      html += '<tr><td>' + esc(item.model) + '</td><td>' + item.qty + '</td><td>' + item.unitPrice.toFixed(2) + '</td><td>' + item.subtotal.toFixed(2) + '</td></tr>';
    else
      html += '<tr><td>' + esc(item.model) + '</td><td>' + item.qty + '</td><td colspan="2" style="color:red">未找到</td></tr>';
  });
  html += '</tbody>';
  html += '<tfoot><tr><td colspan="2" style="text-align:right;font-weight:600">Order Quantity:</td><td colspan="2">' + totalQty + ' Sets</td></tr>';
  html += '<tr><td colspan="2" style="text-align:right;font-weight:700">Total:</td><td colspan="2" style="font-weight:700">' + grandTotal.toFixed(2) + ' USD</td></tr></tfoot>';
  html += '</table>';

  // 底部信息
  html += '<table class="qt-info"><tbody>';
  html += '<tr><td>Payment Method:</td><td>T/T Bank Transfer (Bank details will be provided upon order confirmation)</td></tr>';
  html += '<tr><td>Payment Terms:</td><td>' + esc(payment) + '</td></tr>';
  html += '<tr><td>Item Details</td><td>Details</td></tr>';
  html += '<tr><td>Packaging:</td><td>Standard Packaging (OEM Available)</td></tr>';
  html += '<tr><td>Lead Time:</td><td>' + esc(delivery) + '</td></tr>';
  html += '<tr><td>Quotation Validity:</td><td>' + validity + ' Days</td></tr>';
  html += '<tr><td>Delivery Method:</td><td>Sea / Air / Express DHL / FedEx</td></tr>';
  html += '<tr><td>Port of Loading:</td><td>Ningbo / Shenzhen</td></tr>';

  html += '<tr><td>WhatsApp:</td><td>+86 155 2901 1024</td></tr>';
  html += '<tr><td>Email:</td><td>jerry1001333@gmail.com</td></tr>';
  html += '</tbody></table>';

  document.getElementById('qCard').innerHTML = html;
  document.getElementById('qSection').style.display = 'block';
  // 渲染可编辑的SKU列表

// ====== 直接导出PDF（无打印对话框，无页眉页脚）======
function exportPDF() {
  if (quotationItems.length === 0) { alert('请先输入SKU编号！'); return; }
  if (document.getElementById('qSection').style.display === 'none') { alert('请先生成报价单预览'); return; }

  var qCard = document.getElementById('qCard');
  
  // 使用html2canvas捕获内容区域
  html2canvas(qCard, {
    scale: 2,               // 2倍分辨率，内容清晰
    useCORS: true,
    backgroundColor: '#ffffff',
    logging: false
  }).then(function(canvas) {
    var imgData = canvas.toDataURL('image/png');
    var imgWidth = canvas.width;
    var imgHeight = canvas.height;
    
    // A4 宽595.28pt，按内容比例计算
    var pdfWidth = 595.28;
    var pdfHeight = (imgHeight * pdfWidth) / imgWidth;
    
    var { jsPDF } = window.jspdf;
    var pdf = new jsPDF('p', 'pt', 'a4');
    
    // 如果内容高度超过A4，分页
    var pageHeight = 841.89;  // A4 height in pt
    var heightLeft = pdfHeight;
    var position = 0;
    var imgHeightOnPdf = pdfWidth * (imgHeight / imgWidth);
    
    // 第一页
    pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeightOnPdf);
    heightLeft -= pageHeight;
    
    // 后续页
    while (heightLeft > 0) {
      position = heightLeft - imgHeightOnPdf;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeightOnPdf);
      heightLeft -= pageHeight;
    }
    
    // 下载文件
    var now = new Date();
    var qNo = 'Q' + now.toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random()*900)+100);
    pdf.save(qNo + '.pdf');
  }).catch(function(err) {
    console.error('PDF export failed:', err);
    alert('PDF导出失败，请重试！');
  });
}

// ====== 下载Excel - 使用ExcelJS ======
function downloadQuotation() {
  if (quotationItems.length === 0) { alert('请先输入SKU编号！'); return; }
  
  var now = new Date(), qNo = 'Q' + now.toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random()*900)+100);
  var delivery = document.getElementById('delivery').value, payment = document.getElementById('payment').value;
  var validity = document.getElementById('validity').value;
  var dateStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0');

  if (!exceljsLoaded) {
    if (typeof ExcelJS !== 'undefined') {
      exceljsLoaded = true;
    } else {
      downloadBasicExcel(qNo, dateStr, delivery, payment, validity);
      return;
    }
  }

  try {
    var wb = new ExcelJS.Workbook();
    var ws = wb.addWorksheet('QUOTATION');

    ws.columns = [
      { key:'A', width:20 },
      { key:'B', width:60 },
      { key:'C', width:16 },
      { key:'D', width:16 }
    ];

    var row = 1;

    // 标题行
    ws.mergeCells('A' + row + ':D' + row);
    var titleCell = ws.getCell('A' + row);
    titleCell.value = 'QUOTATION';
    titleCell.alignment = { horizontal:'center', vertical:'middle' };
    titleCell.font = { bold:true, size:18 };
    ws.getRow(row).height = 30;
    row++;

    // 元信息
    var meta = [
      ['Currency:', 'USD'],
      ['Customer:', ''],
      ['Quotation Date:', dateStr],
      ['Quotation No.:', qNo]
    ];
    meta.forEach(function(m) {
      var r = ws.getRow(row);
      r.getCell(1).value = m[0];
      r.getCell(1).font = { bold:true };
      r.getCell(2).value = m[1];
      ws.mergeCells('B' + row + ':D' + row);
      row++;
    });

    row++;

    // 表头
    var hdr = ws.getRow(row);
    var headers = ['Model', 'Qty', 'Unit Price', 'Subtotal'];
    headers.forEach(function(text, i) {
      var cell = hdr.getCell(i + 1);
      cell.value = text;
      cell.alignment = { horizontal:'center', vertical:'middle' };
      cell.font = { bold:true };
      cell.border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
    });
    row++;

    // 产品行
    var gt = 0, totalQty = 0;
    quotationItems.forEach(function(item) {
      totalQty += item.qty;
      var r = ws.getRow(row);
      r.getCell(1).value = item.model;
      r.getCell(1).border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
      r.getCell(2).value = item.qty;
      r.getCell(2).alignment = { horizontal:'right' };
      r.getCell(2).border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
      if (item.unitPrice !== null) {
        r.getCell(3).value = item.unitPrice;
        r.getCell(3).numFmt = '0.00';
        r.getCell(3).alignment = { horizontal:'right' };
        r.getCell(3).border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
        r.getCell(4).value = item.subtotal;
        r.getCell(4).numFmt = '0.00';
        r.getCell(4).alignment = { horizontal:'right' };
        r.getCell(4).border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
        gt += item.subtotal;
      } else {
        r.getCell(3).value = 'N/A';
        r.getCell(3).alignment = { horizontal:'center' };
        r.getCell(4).value = 'N/A';
        r.getCell(4).alignment = { horizontal:'center' };
      }
      row++;
    });

    row++;
    var r1 = ws.getRow(row);
    ws.mergeCells('A' + row + ':B' + row);
    r1.getCell(1).value = 'Order Quantity:';
    r1.getCell(1).font = { bold:true };
    r1.getCell(1).alignment = { horizontal:'right' };
    ws.mergeCells('C' + row + ':D' + row);
    r1.getCell(3).value = totalQty + ' Sets';
    r1.getCell(3).alignment = { horizontal:'right' };
    row++;

    var r2 = ws.getRow(row);
    ws.mergeCells('A' + row + ':B' + row);
    r2.getCell(1).value = 'Total:';
    r2.getCell(1).font = { bold:true };
    r2.getCell(1).alignment = { horizontal:'right' };
    ws.mergeCells('C' + row + ':D' + row);
    r2.getCell(3).value = gt;
    r2.getCell(3).numFmt = '0.00 "USD"';
    r2.getCell(3).font = { bold:true };
    r2.getCell(3).alignment = { horizontal:'right' };
    row++;

    row += 2;

    var info = [
      ['Payment Method:', 'T/T Bank Transfer (Bank details will be provided upon order confirmation)'],
      ['Payment Terms:', payment],
      ['Item Details', 'Details'],
      ['Packaging:', 'Standard Packaging (OEM Available)'],
      ['Lead Time:', delivery],
      ['Quotation Validity:', validity + ' Days'],
      ['Delivery Method:', 'Sea / Air / Express DHL / FedEx'],
      ['Port of Loading:', 'Ningbo / Shenzhen'],
      ['Price Basis:', 'FOB China (Sea freight basis)'],
      ['Shipping Cost:', 'Included in FOB price'],
      ['WhatsApp:', '+86 155 2901 1024'],
      ['Email:', 'jerry1001333@gmail.com']
    ];
    info.forEach(function(m) {
      var r = ws.getRow(row);
      r.getCell(1).value = m[0];
      r.getCell(1).font = { bold:true };
      r.getCell(2).value = m[1];
      ws.mergeCells('B' + row + ':D' + row);
      row++;
    });

    wb.xlsx.writeBuffer().then(function(buf) {
      var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'QUOTATION_' + qNo + '.xlsx';
      a.click();
      URL.revokeObjectURL(a.href);
      showStatus('✅ Excel 下载完成', 'success');
    }).catch(function(err) {
      console.error(err);
      showStatus('❌ Excel 生成失败: ' + err.message, 'error');
    });
  } catch(e) {
    console.error(e);
    showStatus('❌ ExcelJS 错误: ' + e.message, 'error');
  }
}

// SheetJS 基础下载（备用）
function downloadBasicExcel(qNo, dateStr, delivery, payment, validity) {
  var wsData = [];
  wsData.push(['QUOTATION']);
  wsData.push([]);
  wsData.push(['Currency:', 'USD']);
  wsData.push(['Customer:', '']);
  wsData.push(['Quotation Date:', dateStr]);
  wsData.push(['Quotation No.:', qNo]);
  wsData.push([]);
  wsData.push(['Model', 'Qty', 'Unit Price', 'Subtotal']);
  var gt = 0, totalQty = 0;
  quotationItems.forEach(function(item) {
    totalQty += item.qty;
    if (item.unitPrice !== null) {
      wsData.push([item.model, item.qty, item.unitPrice.toFixed(2), item.subtotal.toFixed(2)]);
      gt += item.subtotal;
    } else {
      wsData.push([item.model, item.qty, 'N/A', 'N/A']);
    }
  });
  wsData.push([]);
  wsData.push(['Order Quantity:', totalQty + ' Sets']);
  wsData.push(['Total:', gt.toFixed(2) + ' USD']);
  wsData.push([]);
  wsData.push(['Payment Method:', 'T/T Bank Transfer']);
  wsData.push(['Payment Terms:', payment]);
  wsData.push(['Lead Time:', delivery]);
  wsData.push(['Quotation Validity:', validity + ' Days']);

  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb, ws, 'QUOTATION');
  XLSX.writeFile(wb, qNo + '.xlsx');
  showStatus('✅ Excel 下载完成（基础版）', 'success');
}

// 上传产品库
document.getElementById('dbFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  showStatus('⏳ 读取 ' + file.name + ' …', '');
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var data = new Uint8Array(evt.target.result);
      var workbook = XLSX.read(data, { type:'array' });
      var sheetName = workbook.SheetNames[0];
      var sheet = workbook.Sheets[sheetName];
      var json = XLSX.utils.sheet_to_json(sheet, { header:1 });
      var loaded = 0;
      json.forEach(function(row) {
        if (!row || row.length < 2) return;
        var sku = String(row[0]).trim().toUpperCase();
        var cost = parseFloat(row[1]);
        if (sku && !isNaN(cost)) {
          _DB[sku] = cost;
          loaded++;
        }
      });
      showStatus('✅ 已加载 ' + loaded + ' 条产品（覆盖/追加）', 'success');
      document.getElementById('dbStatus').innerHTML = '✅ 已内嵌 ' + Object.keys(_DB).length + ' 个产品（含上传 ' + loaded + ' 条），可直接输入SKU查询';
    } catch(err) {
      showStatus('❌ 读取失败: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
});

// 绑定SKU列表数量修改事件（使用事件委托）
var _skipRender = false;
function bindSKUListEvents() {
  var list = document.getElementById('skuList');
  // 移除旧监听器（通过替换节点）
  var newList = list.cloneNode(true);
  list.parentNode.replaceChild(newList, list);
  newList.addEventListener('input', function(e) {
    if (!e.target.classList.contains('sku-qty-input')) return;
    var idx = parseInt(e.target.getAttribute('data-idx'));
    var newQty = parseInt(e.target.value) || 1;
    if (idx >= 0 && idx < quotationItems.length) {
      quotationItems[idx].qty = newQty;
      // 同步更新textarea
      var text = '';
      quotationItems.forEach(function(item) {
        text += item.model + '  ' + item.qty + '\n';
      });
      document.getElementById('skuInput').value = text.trim();
      _skipRender = true;
      buildQuotation();
      _skipRender = false;
    }
  });
}

// 输入SKU后自动生成报价单（延迟500ms防抖）
var _debounceTimer = null;
document.getElementById('skuInput').addEventListener('input', function() {
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(function() {
    var skus = document.getElementById('skuInput').value.trim();
    if (skus.length > 0) {
      buildQuotation();
    } else {
      document.getElementById('qSection').style.display = 'none';
      renderSKUList();
    }
  }, 500);
});
