<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press-on Nails Quotation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#e8eaed;color:#333}
.app{max-width:860px;margin:30px auto}
.header{background:linear-gradient(135deg,#2d3748,#1a202c);border-radius:16px 16px 0 0;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.header h1{font-size:18px;font-weight:600;letter-spacing:.5px}
.header .company{font-size:13px;color:#a0aec0}
.card{background:#fff;border-radius:0 0 16px 16px;padding:24px 28px 32px;box-shadow:0 4px 24px rgba(0,0,.08)}
.section-title{font-size:14px;font-weight:600;color:#1a202c;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sku-textarea{width:100%;min-height:110px;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;line-height:1.7;resize:vertical;font-family:'SF Mono',Monaco,Consolas,monospace}
.sku-textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.sku-hint{font-size:12px;color:#a0aec0;margin-top:6px;line-height:1.6}
    .sku-list{margin-top:10px;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;background:#f7fafc;display:none}
    .sku-list-title{font-size:13px;font-weight:600;color:#4a5568;margin-bottom:8px}
    .sku-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #edf2f7}
    .sku-item:last-child{border-bottom:none}
    .sku-item .sku-name{font-size:14px;color:#1a202c;font-weight:500;min-width:90px}
    .sku-item .sku-qty-label{font-size:13px;color:#718096;margin-left:auto}
    .sku-item .sku-qty-input{padding:5px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:14px;text-align:right;width:80px;background:#fff}
.sku-hint code{background:#f1f5f9;padding:1px 5px;border-radius:4px}
.btn-load{width:100%;padding:12px;background:#1a202c;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.btn-load:hover{background:#2d3748}
.profit-row{display:flex;align-items:center;gap:8px;margin-top:18px}
.profit-label{font-size:14px;font-weight:600;white-space:nowrap}
.profit-btns{display:flex;gap:8px;flex:1}
.pbtn{flex:1;padding:9px 0;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#4a5568;font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.pbtn:hover{background:#f7fafc}
.pbtn.active{background:#1a202c;color:#fff;border-color:#1a202c}
.param-row{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.param-item{flex:1;min-width:140px}
.param-item label{font-size:13px;color:#718096;display:block;margin-bottom:5px}
.param-item input,.param-item select{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;color:#1a202c}
.param-item input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.action-bar{display:flex;gap:12px;margin-top:22px}
.btn-action{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;transition:all .15s}
.btn-clear{background:#fff;color:#4a5568;border:1px solid #e2e8f0}
.btn-download{background:linear-gradient(135deg,#68d391,#48bb78);color:#fff}
.btn-pdf{background:linear-gradient(135deg,#f56565,#e53e3e);color:#fff}
.btn-download:hover{background:linear-gradient(135deg,#48bb78,#38a169)}
input[type=file]{display:none}
#status{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:6px;display:none}

/* 报价单预览 - 比原始版大一点点 */
.quotation-section{margin-top:32px}
.quotation-card{background:#fff;border:1px solid #333;border-radius:4px;padding:32px 40px;max-width:800px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.12);font-size:15px;color:#000}
.qt-title{text-align:center;font-size:22px;font-weight:700;letter-spacing:3px;margin-bottom:20px}
.qt-meta{width:100%;border-collapse:collapse;margin-bottom:16px;border:1px solid #000}
.qt-meta td{padding:9px 14px;border:1px solid #000}
.qt-meta td:first-child{width:35%;font-weight:600;background:#f5f5f5}
.qt-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
.qt-table th{border:1px solid #000;padding:9px 14px;text-align:center;font-weight:600;background:#f0f0f0;font-size:15px}
.qt-table td{border:1px solid #000;padding:8px 14px;text-align:right;font-size:15px}
.qt-table td:first-child{text-align:left}
.qt-table tfoot td{font-weight:700;font-size:15px}
.qt-info{width:100%;border-collapse:collapse;margin-top:16px;border:1px solid #000}
.qt-info td{padding:8px 14px;border:1px solid #000}
.qt-info td:first-child{width:200px;font-weight:600;background:#f9f9f9}
.qt-empty{text-align:center;padding:60px 20px;color:#aaa}
@media print{
  body *{visibility:hidden}
  #qSection,#qSection *{visibility:visible}
  #qSection{position:absolute;left:0;top:0;width:100%;padding:20px}
  .quotation-card{box-shadow:none;border:1px solid #000}
  .action-bar{display:none !important}
}
@media(max-width:600px){.card{padding:18px 16px 24px}.param-row{flex-direction:column;gap:10px}.action-bar{flex-direction:column}.quotation-card{padding:20px}}

    /* 标签切换栏 */
    .tab-bar {
      display: flex;
      gap: 0;
      margin: 20px 0 12px 0;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: #f7fafc;
      color: #718096;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }
    .tab-btn:first-child {
      border-radius: 8px 0 0 0;
    }
    .tab-btn:last-child {
      border-radius: 0 8px 0 0;
    }
    .tab-btn:hover {
      background: #edf2f7;
      color: #4a5568;
    }
    .tab-btn.active {
      background: #fff;
      color: #4299e1;
      border-bottom: 3px solid #4299e1;
    }
    /* 缩小Excel按钮 */
    .btn-download-small {
      background: linear-gradient(135deg, #63b3ed, #4299e1) !important;
      font-size: 12px !important;
      padding: 6px 12px !important;
      flex: 0.6 !important;
    }

  </style>
<!-- 本地库，无需网页服务器 -->
<script src="xlsx.full.min.js"></script>
<script src="exceljs.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.2.0/build/index.umd.min.js"></script>
<script src="jspdf.autotable.min.js"></script>
<script src="html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>✦ QUOTATION</h1>
    <span class="company">东阳市迪佳工艺品有限公司</span>
  </div>
  <div class="card">
    <div class="section-title">输入SKU编号</div>
    <textarea id="skuInput" class="sku-textarea" placeholder="每行一个SKU，空格后跟数量&#10;&#10;例如：&#10;AW420  50&#10;CW620  30&#10;BW162  100"></textarea>
    <div class="sku-hint">格式：<code>SKU编号  数量</code> &nbsp; 只写SKU则使用默认起订量</div>
    <div id="skuList" class="sku-list"></div>
    <label class="btn-load" for="dbFile">⊕ 上传产品库Excel（可选）</label>
    <input type="file" id="dbFile" accept=".xlsx,.xls,.csv">
    <div id="dbStatus" style="margin-top:8px;font-size:13px;color:#38a169;">✅ 已内嵌 749 个产品，可直接输入SKU查询</div>
    <div id="status"></div>

    <div class="profit-row">
      <span class="profit-label">〰 利润率</span>
      <div class="profit-btns">
        <button class="pbtn" data-r="30" onclick="setP(30)">30%</button>
        <button class="pbtn" data-r="35" onclick="setP(35)">35%</button>
        <button class="pbtn" data-r="40" onclick="setP(40)">40%</button>
        <button class="pbtn" data-r="45" onclick="setP(45)">45%</button>
        <button class="pbtn active" data-r="50" onclick="setP(50)">50%</button>
      </div>
    </div>

    <div class="param-row">
      <div class="param-item"><label>$ 汇率 (1 USD = ? RMB)</label><input type="number" id="exRate" value="6.8" step="0.01"></div>
      <div class="param-item"><label>🔢 统一数量（留空用各行数量）</label><input type="number" id="uniQty" min="1" placeholder="例如 7"></div>
      <div class="param-item"><label>📅 有效期 (天)</label><input type="number" id="validity" value="7" min="1"></div>
    </div>
    <div class="param-row" id="mixBatchRow" style="display:none;">
      <div class="param-item"><label>📦 混批总数量</label><input type="number" id="mixTotal" min="1" placeholder="例如 200"></div>
      <div class="param-item" style="display:flex;align-items:center;gap:8px;">
        <button class="btn-action" onclick="applyMixBatch()" style="background:linear-gradient(135deg,#ed8936,#dd6b20);font-size:13px;padding:8px 16px;">🔀 应用混批分配</button>
        <span id="mixBatchHint" style="font-size:12px;color:#718096;"></span>
      </div>
    </div>
    <div class="param-row">
      <div class="param-item"><label>🕐 交货期</label><input type="text" id="delivery" value="7-15 Working Days"></div>
    </div>
    <div class="param-row">
      <div class="param-item"><label>💳 付款条款</label><input type="text" id="payment" value="50% Deposit, Balance Before Shipment"></div>
    </div>

    <div class="section-title" style="margin-top:20px;border-top:1px solid #edf2f7;padding-top:16px">📋 客户信息（PI 形式发票用，留空不填）</div>
    <div class="param-row">
      <div class="param-item" style="flex:2"><label>🏢 客户名称</label><input type="text" id="buyerName" placeholder="Company Name"></div>
      <div class="param-item"><label>📞 电话</label><input type="text" id="buyerTel" placeholder="TEL"></div>
    </div>
    <div class="param-row">
      <div class="param-item" style="flex:2"><label>📍 客户地址</label><input type="text" id="buyerAddr" placeholder="Customer Address"></div>
      <div class="param-item"><label>📠 传真</label><input type="text" id="buyerFax" value="N/A" placeholder="FAX"></div>
    </div>

    <div class="action-bar">
      <button class="btn-action btn-clear" onclick="clearAll()">🗑 清空</button>
      <button class="btn-action btn-download btn-download-small" onclick="downloadQuotation()">⬇ Excel</button>
      <button class="btn-action btn-pdf" onclick="exportPDF()" style="flex:0.8">📄 报价单 PDF</button>
      <button class="btn-action" onclick="downloadPI_Word()" style="background:linear-gradient(135deg,#48bb78,#38a169);font-size:13px;padding:8px 14px;flex:0.8">📥 PI Word</button>
      <button class="btn-action btn-pdf" onclick="exportPI_PDF()" style="background:linear-gradient(135deg,#9f7aea,#805ad5);flex:0.9">🧾 形式发票 PI</button>
    </div>
  </div>

  <!-- 标签切换预览 -->
  <div class="tab-bar" id="tabBar" style="display:none;">
    <button class="tab-btn" id="tabQuotation" onclick="showTab('quotation')">📋 报价单预览</button>
    <button class="tab-btn" id="tabPI" onclick="showTab('pi')">🧾 PI 预览</button>
  </div>

  <div class="quotation-section" id="qSection" style="display:none;">
    <div class="quotation-card" id="qCard"></div>
  </div>

  <!-- PI 预览区（可选显示） -->
  <div class="quotation-section" id="piSection" style="display:none;margin-top:24px;">
    <div style="text-align:center;font-size:13px;color:#38a169;margin-bottom:8px;">✅ Proforma Invoice 已就绪，点击「形式发票 PI」导出PDF</div>
  </div>
</div>

  statusEl.style.background = type === 'error' ? '#fed7d7' : (type === 'success' ? '#c6f6d5' : '#f7fafc');
  statusEl.innerHTML = msg;
}

  if (!total || total < 1) { alert('请输入有效的混批总数量！'); return; }

  var base = Math.floor(total / count);
  var remainder = total % count;
  if (base === 0 && remainder < count) {
    // 总数不够分，每人至少1个
    var result = [];

    var newText = dist.map(function(item, i) { return entries[i] + '\t' + item; }).join('\n');
    document.getElementById('skuInput').value = newText;

  }

  // 正常分配：前 remainder 个多得 1
  var dist = [];
  for (var i = 0; i < count; i++) {
    dist.push(i < remainder ? base + 1 : base);
  }
  var sum = dist.reduce(function(a, b){return a+b}, 0);
  // 如果有余数分配导致和不对，微调最后一个
  if (sum !== total) {
    dist[0] += (total - sum);
  }

  var newText = dist.map(function(item, i) { return entries[i] + '\t' + item; }).join('\n');
  document.getElementById('skuInput').value = newText;
  // 清空统一数量，避免冲突
  document.getElementById('uniQty').value = '';
  buildQuotation();
}

// 通用均匀分配算法
function distributeEvenly(count, total) {
  var base = Math.floor(total / count);
  var rem = total % count;
  var result = [];
  for (var i = 0; i < count; i++) {
    result.push(i < rem ? base + 1 : base);
  }
  return result;
}

function parseSKUs() {
  var text = document.getElementById('skuInput').value.trim();
  if (!text) return [];
  var uniQtyInp = document.getElementById('uniQty').value.trim();
  var useUniQty = uniQtyInp !== '' && parseInt(uniQtyInp) > 0;
  var uniQty = useUniQty ? parseInt(uniQtyInp) : null;
  var defaultQty = 50;
  return text.split('\n').filter(function(l){return l.trim()}).map(function(line) {
    var parts = line.trim().split(/[\s\t]+/);
    var sku = parts[0].toUpperCase();
    var qty;
    if (useUniQty) {
      qty = uniQty;
    } else if (parts[1] && parseInt(parts[1]) > 0) {
      qty = parseInt(parts[1]);
    } else {
      qty = defaultQty;
    }
    return { sku: sku, qty: qty };
  }).filter(function(x){return x.sku});
}

}

// 上传产品库
document.getElementById('dbFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  showStatus('⏳ 读取 ' + file.name + ' …', '');
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var data = new Uint8Array(evt.target.result);
      var workbook = XLSX.read(data, { type:'array' });
      var sheetName = workbook.SheetNames[0];
      var sheet = workbook.Sheets[sheetName];
      var json = XLSX.utils.sheet_to_json(sheet, { header:1 });
      var loaded = 0;
      json.forEach(function(row) {
        if (!row || row.length < 2) return;
        var sku = String(row[0]).trim().toUpperCase();
        var cost = parseFloat(row[1]);
        if (sku && !isNaN(cost)) {
          _DB[sku] = cost;
          loaded++;
        }
      });
      showStatus('✅ 已加载 ' + loaded + ' 条产品（覆盖/追加）', 'success');
      document.getElementById('dbStatus').innerHTML = '✅ 已内嵌 ' + Object.keys(_DB).length + ' 个产品（含上传 ' + loaded + ' 条），可直接输入SKU查询';
    } catch(err) {
      showStatus('❌ 读取失败: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
});

// 绑定SKU列表数量修改事件（使用事件委托）
var _skipRender = false;
function bindSKUListEvents() {
  var list = document.getElementById('skuList');
  // 移除旧监听器（通过替换节点）
  var newList = list.cloneNode(true);
  list.parentNode.replaceChild(newList, list);
  newList.addEventListener('input', function(e) {
    if (!e.target.classList.contains('sku-qty-input')) return;
    var idx = parseInt(e.target.getAttribute('data-idx'));
    var newQty = parseInt(e.target.value) || 1;
    if (idx >= 0 && idx < quotationItems.length) {
      quotationItems[idx].qty = newQty;
      // 同步更新textarea
      var text = '';
      quotationItems.forEach(function(item) {
        text += item.model + '  ' + item.qty + '\n';
      });
      document.getElementById('skuInput').value = text.trim();
      _skipRender = true;
      buildQuotation();
      _skipRender = false;
    }
  });
}

// 输入SKU后自动生成报价单（延迟500ms防抖）
var _debounceTimer = null;
document.getElementById('skuInput').addEventListener('input', function() {
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(function() {
    var skus = document.getElementById('skuInput').value.trim();
    if (skus.length > 0) {
      // 显示混批行、标签栏和报价单预览
      var entries = skus.split('\n').filter(function(l){return l.trim()}).map(function(l){return l.trim().split(/[\s\t]+/)[0]}).filter(function(s){return s});
      var count = entries.length;
      document.getElementById('mixBatchRow').style.display = count > 1 ? 'flex' : 'none';
      document.getElementById('mixBatchHint').textContent = count > 1 ? count + ' 个SKU（填混批总数量→应用）' : '';
      // 显示标签栏和默认报价单预览
      document.getElementById('tabBar').style.display = 'flex';
      if (currentTab === null || currentTab === 'quotation') {
        document.getElementById('tabQuotation').classList.add('active');
        document.getElementById('tabPI').classList.remove('active');
        currentTab = 'quotation';
        document.getElementById('qSection').style.display = 'block';
        document.getElementById('piSection').style.display = 'none';
      }
      buildQuotation();
    } else {
      document.getElementById('qSection').style.display = 'none';
      document.getElementById('piSection').style.display = 'none';
      document.getElementById('tabBar').style.display = 'none';
      document.getElementById('mixBatchRow').style.display = 'none';
      document.getElementById('tabQuotation').classList.remove('active');
      document.getElementById('tabPI').classList.remove('active');
      currentTab = null;
      // renderSKUList(); // 已隐藏

  }, 500);
});
